name: Tests

on:
  push:
  pull_request:

jobs:
  pipelines:
    name: Pipelines (DuckDB cleaners, FINEP loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the Python of apache/airflow:2.10.4
      - run: pip install duckdb==2.0.0 openpyxl==3.1.5 pytest
      - run: pytest tests/pipelines -v

  backend:
    name: Backend (network and search on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: osint_admin   # the migrations grant to this role
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: osint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: osint_test
      POSTGRES_USER: osint_admin
      POSTGRES_PASSWORD: ci_password
      KEYCLOAK_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Apply Flyway migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/infrastructure/postgres/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/osint_test \
            -e FLYWAY_USER=osint_admin -e FLYWAY_PASSWORD=ci_password \
            -e FLYWAY_DEFAULT_SCHEMA=public -e FLYWAY_TABLE=flyway_schema_history \
            -e FLYWAY_SCHEMAS=cnpj,finep,geo,airflow,naturalization,sanctions,contracts,inpi \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql/cnpj,filesystem:/flyway/sql/finep,filesystem:/flyway/sql/geo,filesystem:/flyway/sql/inpi \
            -e FLYWAY_VALIDATE_MIGRATION_NAMING=true \
            flyway/flyway:11-alpine migrate
      - name: Load the dev seed
        run: psql -v ON_ERROR_STOP=1 -q -f dev/data/postgres/seed_sample.sql
        env:
          PGHOST: localhost
          PGUSER: osint_admin
          PGPASSWORD: ci_password
          PGDATABASE: osint_test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # the Python of the backend image
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest tests/backend -v

  frontend:
    name: Frontend (type check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit && vite build
