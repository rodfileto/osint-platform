x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: infrastructure/airflow/Dockerfile
  image: osint-platform-airflow:latest
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    TZ: ${TZ:-America/Sao_Paulo}
  volumes:
    - ./pipelines/dags:/opt/airflow/dags
    - ./pipelines/logs:/opt/airflow/logs
    - ./pipelines/plugins:/opt/airflow/plugins
    - ./pipelines/scripts:/opt/airflow/scripts
    - ./pipelines/dbt:/opt/airflow/dbt
    - ${AIRFLOW_DATA_HOST_PATH:-./data/airflow/data}:/opt/airflow/data
    - ${AIRFLOW_TEMP_SSD_HOST_PATH:-./data/airflow/temp_ssd}:/opt/airflow/temp_ssd
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    flyway:
      condition: service_completed_successfully

services:
  postgres:
    image: postgis/postgis:16-3.4
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-8GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-4}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-4}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-512MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET:-200}
      - -c
      - huge_pages=${POSTGRES_HUGE_PAGES:-try}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${POSTGRES_DATA_HOST_PATH:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_EXPOSE_PORT:-5432}:5432
    shm_size: ${POSTGRES_SHM_SIZE:-2g}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-${KEYCLOAK_URL:-http://localhost:8081}}
      KC_HOSTNAME_STRICT: 'false'
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - ${KEYCLOAK_PORT:-8081}:8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${MINIO_DATA_HOST_PATH:-./data/minio}:/data
    ports:
      - ${MINIO_API_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    restart: unless-stopped

  flyway:
    image: flyway/flyway:11-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_SCHEMAS: cnpj,finep,geo,airflow,naturalization,sanctions,contracts,inpi
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/cnpj,filesystem:/flyway/sql/finep,filesystem:/flyway/sql/geo,filesystem:/flyway/sql/inpi
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      FLYWAY_CLEAN_DISABLED: 'true'
      FLYWAY_CONNECT_RETRIES: '60'
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./infrastructure/postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build: ./backend

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-}
      VITE_KEYCLOAK_ENABLED: ${VITE_KEYCLOAK_ENABLED:-true}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-${KEYCLOAK_URL:-http://localhost:8081}}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-osint-platform}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-osint-frontend}

  airflow-webserver:
    <<: *airflow-common
    profiles:
      - airflow
    command: webserver
    ports:
      - ${AIRFLOW_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    profiles:
      - airflow
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 30s
      retries: 5
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    profiles:
      - airflow
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    profiles:
      - airflow
    # Docker creates missing bind-mount dirs as root, which the non-root Airflow
    # services cannot write to. Data dirs are only re-owned at the top level and
    # only when root owns them, so existing data keeps its ownership.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        for dir in /opt/airflow/data /opt/airflow/temp_ssd; do
          if [ "$$(stat -c %u "$$dir")" = 0 ]; then chown "${AIRFLOW_UID:-50000}:0" "$$dir"; fi
        done
        exec /usr/bin/dumb-init -- /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: '0:0'
    restart: 'no'

  airflow-cli:
    <<: *airflow-common
    profiles:
      - airflow
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: '0'
    command:
      - bash
      - -c
      - airflow
    restart: 'no'

volumes:
  keycloak_data:
